name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Verify Swift Toolchain & Test Suite
      run: |
        swift test

    - name: Build iOS Application (iPhone Simulator / Unsigned IPA)
      run: |
        xcodebuild -scheme ShoppeFoodMap \
          -sdk iphonesimulator \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          build
