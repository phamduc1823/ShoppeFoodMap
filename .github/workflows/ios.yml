name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Verify Swift Toolchain & Test Suite
      run: |
        swift test

    - name: Build Official iOS App Bundle & IPA Package
      run: |
        # 1. Compile Swift executable target for iOS device
        xcodebuild -scheme ShoppeFoodMap \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build

        # 2. Construct valid iOS Payload app bundle
        mkdir -p Payload/ShoppeFoodMap.app
        
        # Locate compiled executable binary
        BIN_PATH=$(find build/Build/Products/Release-iphoneos -name "ShoppeFoodMap" -type f -not -name "*.swiftmodule" | head -n 1)
        if [ -z "$BIN_PATH" ]; then
          BIN_PATH=$(find build .build -name "ShoppeFoodMap" -type f -not -name "*.swiftmodule" | head -n 1)
        fi
        
        echo "Found executable binary at: $BIN_PATH"
        cp "$BIN_PATH" Payload/ShoppeFoodMap.app/ShoppeFoodMap
        cp Info.plist Payload/ShoppeFoodMap.app/Info.plist
        echo -n "APPL????" > Payload/ShoppeFoodMap.app/PkgInfo
        chmod +x Payload/ShoppeFoodMap.app/ShoppeFoodMap

        # 3. Create valid IPA archive for 3uTools & Sideloadly
        zip -r ShoppeFoodMap.ipa Payload

    - name: Upload Downloadable IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShoppeFoodMap-iOS-App
        path: ShoppeFoodMap.ipa
