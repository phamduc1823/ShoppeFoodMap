name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Verify Swift Toolchain & Test Suite
      run: |
        swift test

    - name: Build iOS Application (.app & .ipa)
      run: |
        xcodebuild -scheme ShoppeFoodMap \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build
        
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/PackageFrameworks/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/*.a Payload/ 2>/dev/null || true
        zip -r ShoppeFoodMap.ipa Payload build/Build/Products/Release-iphoneos/

    - name: Upload Downloadable IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShoppeFoodMap-iOS-App
        path: ShoppeFoodMap.ipa
